# Vibe Action — comment
# Replace TODO with a meaningful comment

version: 0.0.2

name: comment
about: Replace TODO with a meaningful comment
notify: true

api:
  output: replace
  input: query_raw

actions:
  - tag: tag_comment
    run: medium
    val:
      - name: raw
        data: query_raw
      - name: content
        data: query_raw
        when: 'is:path'
        mods: 'fetch|text'
      - name: content
        data: query_raw
        fail: 'is:empty:not'
    action: |
      [Task]
      REPLACE every "TODO" and "@todo" in the code with a concise technical comment in English.
      The token "todo" must not remain in the output — not as "@todo", not as "TODO".

      [Rules]
      1. Do not change the original code.
      2. Keep the original comment marker.
      3. File/module-level comment: a brief description in TWO short sentences (one per line).
      4. Class/struct/field/method comment: a brief description, max 7 words.
      5. Preserve exact indentation and structure.
      6. Wrap the entire output in a single code block. ```<language marker> ... ```
      7. Every comment must be unique and describe only its own element, not copied from another.

      Commonly used language markers:
      - ets — ArkTS (.ets)
      - sh — Shell (.sh)
      - bat — Batch (.bat)
      - cs — C# (.cs)
      - dart — Dart (.dart)
      - go — Go (.go)
      - java — Java (.java)
      - js — JavaScript (.js)
      - kt — Kotlin (.kt)
      - py — Python (.py)
      - rs — Rust (.rs)
      - swift — Swift (.swift)
      - ts — TypeScript (.ts)

      [Example]
      Input:
      ```py
      # @todo

      # @todo
      def calculate():
          pass
      ```

      Output:
      ```py
      # Handles metric calculation.

      # Computes and returns metrics.
      def calculate():
          pass
      ```

      [Query Raw]
      {raw}

      [Code]
      {content}
