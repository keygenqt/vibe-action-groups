# Vibe Action — fetch
# Fetch a web page or PDF and describe its content

version: 0.0.2

name: fetch
about: Fetch a web page or PDF and describe its content
notify: true

api:
  output: dialog
  input: query_prompt

actions:
  # Fetch URL/path content and write a summary
  - tag: tag_description
    run: medium
    reg: '.+'
    val:
      - name: content
        data: query_prompt
        mods: 'fetch|text'
      - name: lang
        data: system_language
    action: |
      [Task]
      Write a summary strictly in {lang} language based on the document content below.

      [Requirements]
      1. Length: 2-5 sentences maximum.
      2. Focus: Explain the purpose, type, and core content.
      3. Details: Extract essential tools, key features, and specifics mentioned in the text.
      4. Language: {lang}

      [Content]
      {content}
