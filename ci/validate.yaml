version: '0.0.2'
name: validate
about: Find obvious errors in diff before review

api:
  output: replace
  input: query_project_path

actions:
  # Diff of the current branch against the default branch, code languages only
  # (extensions from vibe_ast) — CI configs, docs and other non-code files
  # are out of scope for review.
  - tag: tag_diff
    run: cmd
    reg: '.+'
    val:
      - name: path
        data: query_project_path
        fail: 'is:empty:not'
      - name: exts
        data: system_code_langs
    action: >-
      cd {path} && out=""; for ext in $(echo {exts}); do
        out="$out$(git diff $(git rev-parse --verify -q main || git rev-parse --verify -q master)...HEAD -- "*.$ext")";
      done; [ -n "$out" ] && printf '%s' "$out" || echo 'No code files in diff'

  - tag: tag_findings
    run: large
    reg: '.+'
    val:
      - name: lang
        data: system_language
      - name: diff
        data: tag_diff
    action: |
      [Task]
      You are a pre-review check for a pull request. Report only clear, actionable
      problems: obvious bugs and logic errors, typos in identifiers or user-facing
      strings, leftover TODO/FIXME/debug code, commented-out blocks, references to
      missing dependencies, broken formatting of structured data.
      Go through the diff file by file. Check specifically for: leftover TODO/FIXME,
      debug prints, commented-out code, typos in identifiers or strings, references to
      missing dependencies, obvious logic errors.
      Commented-out code means real code lines disabled by comments.
      Example: "// let x = compute();" IS commented-out code.
      Example: "// New feature: print current time" is an explanation comment — NOT an issue.
      Do not report documentation or explanation comments.
      For EVERY file in the diff output a section:
      <path>: <numbered findings: line context without diff markers, problem, suggested fix>
      or exactly:
      <path>: OK
      Do not report style preferences or speculative issues.
      Output PLAIN TEXT only: no markdown, no code fences, no backticks,
      no bold or headers. Quote code inline as-is without any formatting.
      After the per-file sections output a final line:
      "FAIL: N file(s) with issues" with the actual count,
      or "No issues found" ONLY if every section above says OK.
      Never output "No issues found" when any section lists findings.
      Write strictly in {lang}.

      [Diff]
      {diff}
