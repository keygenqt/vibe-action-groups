version: '0.0.2'
name: spdx
about: Check SPDX license headers in source files

api:
  output: replace
  input: query_project_path

actions:
  # Collect path + first lines of source files changed in the current branch (extensions from vibe_ast)
  - tag: tag_headers
    run: cmd
    val:
      - name: path
        data: query_project_path
        fail: 'is:empty:not'
      - name: exts
        data: system_code_langs
    action: >-
      cd {path} && git diff $(git rev-parse --verify -q main || git rev-parse --verify -q master)...HEAD
      --name-only --diff-filter=ACMR | while read -r f; do
        for ext in $(echo {exts}); do
          case "$f" in *."$ext") echo "=== $f"; head -n 5 "$f"; echo;; esac
        done
      done

  - tag: tag_check
    run: medium
    reg: '.+'
    val:
      - name: lang
        data: system_language
      - name: headers
        data: tag_headers
        fail: 'is:empty:not'
    action: |
      [Task]
      Below are source files. Each entry starts with "=== <path>" followed by the first
      lines of that file. Every file must contain BOTH SPDX lines in its header comment
      block, matching this syntax:
      SPDX-FileCopyrightText: Copyright <year> <holder> <contact>
      SPDX-License-Identifier: <identifier>
      The lines must sit at the top of the file inside a comment block appropriate for
      the language, not nested inside code.
      For EVERY file listed below output exactly one line:
      <path>: OK
      or
      <path>: <all problems found, comma-separated — e.g. "missing copyright line, missing license line">
      After the list output a final line:
      "FAIL: N file(s) have invalid SPDX headers" with the actual count,
      or "OK: all files have valid SPDX headers" ONLY if every line above says OK.
      Never output the OK line when any file has problems.
      Output PLAIN TEXT only: no markdown, no code fences, no backticks,
      no bold or headers. Quote code inline as-is without any formatting.
      Write strictly in {lang}.

      [Files]
      {headers}
